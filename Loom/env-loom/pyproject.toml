[project]
name = "loom-env"
version = "0.0.1"
description = "Environnement unique Loom : WhisperLiveKit + Pocket TTS embarqués en bibliothèque, orchestrateur asyncio (cf. ADR-0039)."
requires-python = ">=3.12,<3.13"
license = { file = "../../LICENSE" }
authors = [{ name = "Kevin Brunet" }]
# ⚠ Noms de package PyPI et extras repris tels quels de la spec/recherche externe,
#   non vérifiés par une install réelle à ce stade (cf. T0.1/T1.1).
# ⚠ extra "translation" de whisperlivekit retiré : on n'utilise plus NLLB/nllw du tout
# depuis ADR-0040 (hallucinations récurrentes en streaming) — SeamlessM4T v2 (transformers/
# sentencepiece ci-dessous) le remplace entièrement, en dehors de WLK.
# ⚠ speechbrain (ADR-0042) : SepFormer-WHAMR (séparation) + ECAPA-TDNN (embedding de
# locuteur) — version non pinnée, pas encore installée/vérifiée sur la machine cible.
# ✓ nemo-toolkit[asr] : requis par le backend de diarisation Sortformer (ADR-0034), installé
# et validé sur la machine cible (2026-07-15) — source git, pas de release PyPI stable avec
# Sortformer au moment de l'installation, cf. [tool.uv.sources] ci-dessous.
dependencies = [
    "whisperlivekit[diarization-sortformer]",
    "pocket-tts",
    "pydantic>=2.6",
    "numpy>=2.0",
    "transformers>=4.37",
    "sentencepiece>=0.2",
    "speechbrain>=1.0",
    "nemo-toolkit[asr]",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
loom-orchestrator = "loom_orchestrator.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loom_orchestrator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.uv.sources]
nemo-toolkit = { git = "https://github.com/NVIDIA/NeMo.git", rev = "main" }
