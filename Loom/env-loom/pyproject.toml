[project]
name = "loom-env"
version = "0.0.1"
description = "Environnement unique Loom : WhisperLiveKit + Pocket TTS embarqués en bibliothèque, orchestrateur asyncio (cf. ADR-0039)."
requires-python = ">=3.12,<3.13"
license = { file = "../../LICENSE" }
authors = [{ name = "Kevin Brunet" }]
# ⚠ Noms de package PyPI et extras repris tels quels de la spec/recherche externe,
#   non vérifiés par une install réelle à ce stade (cf. T0.1/T1.1).
# ⚠ extra "translation" de whisperlivekit retiré : on n'utilise plus NLLB/nllw du tout
# depuis ADR-0040 (hallucinations récurrentes en streaming) — SeamlessM4T v2 (transformers/
# sentencepiece ci-dessous) le remplace entièrement, en dehors de WLK.
# ⚠ speechbrain (ADR-0042) : SepFormer-WHAMR (séparation) + ECAPA-TDNN (embedding de
# locuteur) — version non pinnée, pas encore installée/vérifiée sur la machine cible.
# ✓ nemo-toolkit[asr] : requis par le backend de diarisation Sortformer (ADR-0034), installé
# et validé sur la machine cible (2026-07-15) — source git, pas de release PyPI stable avec
# Sortformer au moment de l'installation, cf. [tool.uv.sources] ci-dessous.
# ⚠ llama-cpp-python (ADR-0043) : bindings embarqués de llama.cpp pour le petit Qwen de
# traduction — jamais installé/vérifié sur la machine cible. Les wheels CUDA pré-compilées
# publiées par le mainteneur couvrent ~CUDA 12.1-12.4 ; la machine cible tourne CUDA 13 (cf.
# workaround ctranslate2 dans scripts/env.example.sh pour un précédent similaire) — build
# depuis les sources probable :
#   CMAKE_ARGS="-DGGML_CUDA=on" uv sync
# à documenter/adapter une fois testé sur fedora2.
# ⚠ pyannote.audio[separation] (ADR-0044, 2026-07-17) : alternative à SepFormer-WHAMR pour la
# séparation de voix — confirmée audible en isolation (harness_separation.py --backend
# pyannote sur corpus g) mais jamais résolue ensemble avec nemo-toolkit/speechbrain/
# llama-cpp-python dans un même environnement figé (uv.lock) ; testée jusqu'ici uniquement
# via `uv run --with`, qui a révélé un conflit de résolution cassant la détection de
# Sortformer (nemo-toolkit). Version non pinnée (3.3.2 casse avec le torchaudio déjà résolu
# ici, cf. Révisions ADR-0044 — AttributeError AudioMetaData). setuptools<81 requis en plus :
# torchmetrics (dépendance transitive via pytorch_lightning) importe encore pkg_resources,
# retiré des setuptools récents.
dependencies = [
    "whisperlivekit[diarization-sortformer]",
    "pocket-tts",
    "pydantic>=2.6",
    "numpy>=2.0",
    "transformers>=4.37",
    "sentencepiece>=0.2",
    "speechbrain>=1.0",
    "nemo-toolkit[asr]",
    "llama-cpp-python>=0.3",
    "huggingface-hub>=0.24",
    "pyannote.audio[separation]",
    "setuptools<81",
    # ⚠ sounddevice (bindings PortAudio) : entrée micro + sortie mixée de l'orchestrateur live
    # (T2.3, ADR-0045) — jamais installée/testée sur la machine cible. Choix repris du
    # précédent déjà en place dans carson/ (même dépôt, carson/pyproject.toml) plutôt
    # qu'évalué indépendamment : API numpy-friendly (tableaux directs, pas de struct.pack
    # manuel comme PyAudio), callbacks entrée/sortie natifs.
    "sounddevice>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
loom-orchestrator = "loom_orchestrator.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loom_orchestrator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

# ⚠ ADR-0047 : `asteroid` (tiré transitivement par speechbrain/pyannote.audio[separation],
# ADR-0042/0044) impose `pytorch-lightning==1.4.9`, incompatible avec le NeMo `main` récent
# nécessaire au décodage streaming AlignAtt de Canary (import cassé : `pytorch_lightning.metrics`
# essaie d'importer `torchmetrics.utilities.data.get_num_classes`, retiré des torchmetrics
# récents — constaté sur fedora2, 2026-08-15). `override-dependencies` force un PL récent pour
# tout le graphe, y compris `asteroid` — ⚠ pas vérifié si `asteroid` fonctionne réellement avec
# un PL 2.x (probable puisqu'il n'est visiblement pas maintenu activement, ✓ 1.4.9 date de ~2021),
# ni si les chemins de code d'`asteroid` sont réellement exercés au runtime par la séparation de
# voix déjà validée (ADR-0042/0044) — à re-tester (`harness_separation.py`) après ce changement,
# pas supposé sans danger juste parce que l'import réussit.
[tool.uv]
override-dependencies = ["pytorch-lightning>=2.0"]

[tool.uv.sources]
nemo-toolkit = { git = "https://github.com/NVIDIA/NeMo.git", rev = "main" }
