[project]
name = "loom-env"
version = "0.0.1"
description = "Environnement unique Loom : WhisperLiveKit + Pocket TTS embarqués en bibliothèque, orchestrateur asyncio (cf. ADR-0039)."
requires-python = ">=3.12"
license = { file = "../../LICENSE" }
authors = [{ name = "Kevin Brunet" }]
# ⚠ Noms de package PyPI et extras repris tels quels de la spec/recherche externe,
#   non vérifiés par une install réelle à ce stade (cf. T0.1/T1.1).
dependencies = [
    "whisperlivekit[diarization-sortformer,translation]",
    "pocket-tts",
    "pydantic>=2.6",
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
loom-orchestrator = "loom_orchestrator.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loom_orchestrator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
